name: Windows release candidate

on:
  push:
    branches: [main, "m6-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Automated tests
        run: |
          python -m pytest -q
          python -m ruff check .
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build portable package and installer
        shell: pwsh
        run: ./scripts/build_windows_release.ps1
      - name: Expand portable ZIP
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP "bridge-portable"
          try {
            Expand-Archive ./release/AI-Device-Bridge-portable-windows-x64.zip $portableDir
          } catch {
            Write-Host "::error title=Portable ZIP extraction failed::$($_.Exception.Message)"
            throw
          }
      - name: Smoke check portable EXE
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP "bridge-portable"
          $env:AI_DEVICE_BRIDGE_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP "bridge-smoke-report.txt"
          Remove-Item $env:AI_DEVICE_BRIDGE_SMOKE_REPORT -Force -ErrorAction SilentlyContinue
          try {
            $smoke = Start-Process -FilePath (Join-Path $portableDir "AI Device Bridge.exe") -ArgumentList "--smoke-node" -Wait -PassThru
          } catch {
            Write-Host "::error title=Portable EXE launch failed::$($_.Exception.Message)"
            throw
          }
          if ($smoke.ExitCode -ne 0) {
            $errorFile = $env:AI_DEVICE_BRIDGE_SMOKE_REPORT
            if (Test-Path $errorFile) {
              $lastLine = Get-Content $errorFile | Select-Object -Last 1
              Write-Host "::error title=Portable smoke error::$lastLine"
              Add-Content $env:GITHUB_STEP_SUMMARY '### Portable smoke error'
              Add-Content $env:GITHUB_STEP_SUMMARY '```text'
              Get-Content $errorFile | Add-Content $env:GITHUB_STEP_SUMMARY
              Add-Content $env:GITHUB_STEP_SUMMARY '```'
              Get-Content $errorFile
            } else {
              Write-Host "::error title=Portable smoke error::No traceback file was produced."
            }
            throw "Portable node smoke check failed."
          }
      - name: Smoke check installed package
        shell: pwsh
        run: |
          $installer = Resolve-Path ./release/AI-Device-Bridge-Setup.exe
          $installDir = Join-Path $env:RUNNER_TEMP "Bridge Installed"
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed." }
          $env:AI_DEVICE_BRIDGE_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP "bridge-smoke-report.txt"
          Remove-Item $env:AI_DEVICE_BRIDGE_SMOKE_REPORT -Force -ErrorAction SilentlyContinue
          $smoke = Start-Process -FilePath (Join-Path $installDir "AI Device Bridge.exe") -ArgumentList "--smoke-node" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            $errorFile = $env:AI_DEVICE_BRIDGE_SMOKE_REPORT
            if (Test-Path $errorFile) {
              Add-Content $env:GITHUB_STEP_SUMMARY '### Installed smoke error'
              Add-Content $env:GITHUB_STEP_SUMMARY '```text'
              Get-Content $errorFile | Add-Content $env:GITHUB_STEP_SUMMARY
              Add-Content $env:GITHUB_STEP_SUMMARY '```'
              Get-Content $errorFile
            }
            throw "Installed node smoke check failed."
          }
      - name: Check uninstall preserves application data
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "Bridge Installed"
          $dataDir = Join-Path $env:APPDATA "AI Device Bridge"
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $marker = Join-Path $dataDir "ci-retention.txt"
          Set-Content -LiteralPath $marker -Value "preserve user data"
          $uninstall = Start-Process -FilePath (Join-Path $installDir "unins000.exe") -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed." }
          if (-not (Test-Path $marker)) { throw "Uninstall removed user data." }
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Device-Bridge-Windows-candidate
          path: |
            release/AI-Device-Bridge-portable-windows-x64.zip
            release/AI-Device-Bridge-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
