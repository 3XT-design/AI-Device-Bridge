[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-device-bridge"
version = "0.5.0rc2"
description = "AI-assisted file delivery between personal devices"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "cryptography>=44,<47",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
release = [
    "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
